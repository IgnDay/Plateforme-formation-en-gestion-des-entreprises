}

.rubrique-2{

/* ================= POSTES ================= */

}

select,
input{
    width:100%;
    padding:6px;
    border:1px solid #999;
    border-radius:4px;
}

select{
    background:white;
}

.actions{
    margin-top:5px;
}

button{
    border:none;
    padding:5px 10px;
    border-radius:5px;

    font-weight:bold;
}

    background:#27ae60;

}

.delete{
    background:#c0392b;
    color:white;
}

.add:hover,

}

.total{
    background:#2c3e50;
    color:white;
    font-weight:bold;
    font-size:22px;
    height:65px;
}

    padding:12px;

}

/* ================= FOOTER ================= */

footer{
    text-align:center;
    margin-top:25px;
    padding:15px;
    font-size:14px;
    color:#555;
}

footer a{
    text-decoration:none;
    color:#2980b9;
    font-weight:bold;

/* ================= RESPONSIVE ================= */

@media(max-width:900px){

    .container{
        grid-template-columns:1fr;
    }

/* ======================================================
CRÉATION DES TABLEAUX
====================================================== */

function createTable(data, bodyId){

    const body = document.getElementById(bodyId);

    data.forEach(section => {

        const principalRow = document.createElement("tr");

        principalRow.innerHTML = `
            <td class="rubrique-principale">
                > ${section.principal}
            </td>
            <td class="rubrique-principale"></td>
        `;

        body.appendChild(principalRow);

        section.rubriques.forEach((rub, index) => {

            const rubRow = document.createElement("tr");

            rubRow.className = "rubrique-2";

            rubRow.dataset.group =
                bodyId + "_" + section.principal + "_" + index;

            rubRow.innerHTML = `

                <td>

                    >> ${rub.rubrique}

                    <div class="actions">

                        <button
                            type="button"
                            class="add add-poste-btn">
                            + Ajouter Poste
                        </button>

                    </div>

                </td>

                <td></td>

            `;

            body.appendChild(rubRow);

            rubRow.querySelector(".add-poste-btn")
                .addEventListener("click", function(){

                    addPoste(this, rub.postes);

                });

        });

    });

}

/* ======================================================
AJOUT D'UN POSTE
====================================================== */

function addPoste(button, postes){

    const rubriqueRow = button.closest("tr");

    const groupId = rubriqueRow.dataset.group;

    const row = document.createElement("tr");

    row.className = "poste-row";

    row.dataset.group = groupId;

    /* Création des options */

    let options = "";

    postes.forEach(poste => {

        options += `
            <option value="${poste}">
                >>> ${poste}
            </option>
        `;

    });

    row.innerHTML = `

        <td>

            <select class="poste-select">

                ${options}

            </select>

        </td>

        <td>

            <input
                type="number"
                class="amount"
                value="0"
                step="0.01"
                oninput="calculateTotals()"
            >

            <div class="actions">

                <button
                    type="button"
                    class="delete"
                    onclick="deletePoste(this)">
                    Supprimer
                </button>

            </div>

        </td>

    `;

    /*
       On cherche la dernière ligne appartenant
       à la même rubrique afin d'insérer le
       nouveau poste juste après les précédents.
    */

    let lastGroupRow = rubriqueRow;

    let next = rubriqueRow.nextElementSibling;

    while(next){

        if(
            next.classList.contains("rubrique-2") ||
            next.classList.contains("rubrique-principale")
        ){
            break;
        }

        if(next.dataset.group === groupId){

            lastGroupRow = next;

        }

        next = next.nextElementSibling;

    }

    lastGroupRow.after(row);

    calculateTotals();

}

/* ======================================================
SUPPRESSION D'UN POSTE
====================================================== */

function deletePoste(button){

    const row = button.closest(".poste-row");

    if(row){

        row.remove();

    }

    calculateTotals();

}

/* ======================================================
CALCUL DES TOTAUX
====================================================== */

function calculateTotals(){

    let totalActif = 0;

    let totalPassif = 0;

    document
        .querySelectorAll("#tableActif .amount")
        .forEach(input => {

            totalActif += parseFloat(input.value) || 0;

        });

    document
        .querySelectorAll("#tablePassif .amount")
        .forEach(input => {

            totalPassif += parseFloat(input.value) || 0;

        });

    document.getElementById("totalActif").innerText =
        totalActif.toLocaleString("fr-FR", {

            minimumFractionDigits:2,
            maximumFractionDigits:2

        });

    document.getElementById("totalPassif").innerText =
        totalPassif.toLocaleString("fr-FR", {

            minimumFractionDigits:2,
            maximumFractionDigits:2

        });

}

    document.getElementById("totalActif")
        .innerText = "0,00";

    document.getElementById("totalPassif")
        .innerText = "0,00";

}

/* ======================================================
RÉCUPÉRER LA VRAIE SÉLECTION DU SELECT
====================================================== */

/*
    IMPORTANT :

    Cette fonction lit le SELECT du TABLEAU ORIGINAL.

    Elle ne lit PAS le clone.

    C'est précisément la correction du problème
    de l'ancienne version.
*/

function getSelectedPoste(select){

    if(!select){

        return "";

    }

    /*
       selectedIndex correspond à l'option
       réellement sélectionnée par l'utilisateur.
    */

    const index = select.selectedIndex;

    if(index < 0){

        return "";

    }

    const option = select.options[index];

    if(!option){

        return "";

    }

    /*
       textContent récupère exactement le texte
       de l'option choisie.
    */

    return option.textContent.trim();

}

/* ======================================================
RÉCUPÉRER LA VRAIE VALEUR DU MONTANT
====================================================== */

function getSaisieMontant(input){

    if(!input){

        return "0,00";

    }

    /*
       On lit directement input.value
       dans le tableau ORIGINAL.
    */

    const valeur = input.value;

    if(
        valeur === null ||
        valeur === undefined ||
        valeur === ""
    ){

        return "0,00";

    }

    const montant = parseFloat(valeur);

    if(isNaN(montant)){

        return "0,00";

    }

    return montant.toLocaleString("fr-FR", {

        minimumFractionDigits:2,
        maximumFractionDigits:2

    });

}

/* ======================================================
PRÉPARER UN TABLEAU POUR L'EXPORT
====================================================== */

/*
   CORRECTION PRINCIPALE

   1. On clone le tableau.
   2. On récupère TOUTES les lignes .poste-row
      du tableau ORIGINAL.
   3. On récupère TOUTES les lignes .poste-row
      du CLONE.
   4. On parcourt chaque ligne avec son index.
   5. On lit la sélection réelle dans l'original.
   6. On lit le montant réel dans l'original.
   7. On inscrit ces valeurs dans le clone.
   8. Ensuite seulement, on supprime les select/input.

*/

function preparerTableauPourExport(tableOriginal){

    /* =========================
       CLONAGE
    ========================= */

    const clone = tableOriginal.cloneNode(true);

    /* =========================
       RÉCUPÉRATION DES LIGNES
    ========================= */

    const lignesOriginales =
        tableOriginal.querySelectorAll(".poste-row");

    const lignesClone =
        clone.querySelectorAll(".poste-row");

    /*
       Vérification de sécurité :

       On parcourt toutes les lignes originales.
    */

    for(let i = 0; i < lignesOriginales.length; i++){

        const ligneOriginale = lignesOriginales[i];

        const ligneClone = lignesClone[i];

        if(!ligneClone){

            continue;

        }

        /* =========================
           POSTE
        ========================= */

        const selectOriginal =
            ligneOriginale.querySelector(".poste-select");

        const selectClone =
            ligneClone.querySelector(".poste-select");

        if(selectOriginal && selectClone){

            /*
               On lit la vraie sélection
               dans le tableau original.
            */

            const posteSelectionne =
                getSelectedPoste(selectOriginal);

            /*
               On inscrit cette valeur
               directement dans le clone.
            */

            const cellulePoste =
                selectClone.closest("td");

            if(cellulePoste){

                cellulePoste.textContent =
                    posteSelectionne;

            }

        }

        /* =========================
           MONTANT
        ========================= */

        const inputOriginal =
            ligneOriginale.querySelector(".amount");

        const inputClone =
            ligneClone.querySelector(".amount");

        if(inputOriginal && inputClone){

            /*
               On récupère la valeur réelle
               saisie dans l'original.
            */

            const montantSaisi =
                getSaisieMontant(inputOriginal);

            /*
               On inscrit cette valeur
               dans la cellule du clone.
            */

            const celluleMontant =
                inputClone.closest("td");

            if(celluleMontant){

                celluleMontant.textContent =
                    montantSaisi;

            }

        }

    }

    /*
       Suppression des éventuels boutons/actions
       qui resteraient dans le clone.
    */

    clone
        .querySelectorAll("button, .actions")
        .forEach(element => element.remove());

    /*
       Sécurité supplémentaire :

       aucun select ou input ne doit rester
       dans le fichier exporté.
    */

    clone
        .querySelectorAll("select, input")
        .forEach(element => element.remove());

    return clone;

}

/* ======================================================
CONSTRUIRE LE CONTENU COMPLET DE L'EXPORT
====================================================== */

function construireExport(){

    /*
       IMPORTANT :

       On travaille directement avec
       les tableaux ORIGINAUX.
    */

    const tableActifOriginal =
        document.getElementById("tableActif");

    const tablePassifOriginal =
        document.getElementById("tablePassif");

    /*
       Préparation indépendante des deux tableaux.
    */

    const actifClone =
        preparerTableauPourExport(tableActifOriginal);

    const passifClone =
        preparerTableauPourExport(tablePassifOriginal);

    /*
       Retourne les deux tableaux prêts à exporter.
    */

    return {

        actif: actifClone,
        passif: passifClone

    };

}

    setTimeout(

        () => URL.revokeObjectURL(url),

        1000

    );

}
